name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Backend unit tests ──────────────────────────────────────────────
  backend-test:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          # TestConfig uses in-memory SQLite — no Postgres needed
          SECRET_KEY: ci-secret-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          JWT_SECRET_KEY: ci-jwt-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

  # ── 2. Frontend build check ────────────────────────────────────────────
  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  # ── 3. End-to-end tests ────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      # Python for backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      # Node for frontend + Playwright
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Start backend (SQLite + seed)
        run: |
          python wsgi.py &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///ci_e2e.db
          SECRET_KEY: ci-secret-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          JWT_SECRET_KEY: ci-jwt-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          SEED_ON_START: "true"
          FLASK_DEBUG: "false"
          CORS_ORIGINS: "*"

      - name: Wait for backend
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5000/api/health && break
            sleep 1
          done

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: frontend

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
